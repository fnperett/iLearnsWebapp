<script>
    // Keep track of the currently active button
    let activeButton = null;

    document.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", function() {
            // If another button is already active, reset its background
            if (activeButton) {
                activeButton.style.backgroundColor = "white";
            }

            // Set the clicked button as the active button
            activeButton = this;
            const buttonText = this.id;
            console.log("Button clicked:", buttonText);
            this.style.backgroundColor = "gray";

            let inputText = "";

            // Listen for keyboard input
            const handler = function(event) {
                if (event.key === "Enter") {
                    // Send POST request when Enter is pressed
                    fetch("/", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ button_remap: buttonText, id: inputText })
                    }).then(response => response.json())
                      .then(data => console.log("Response:", data))
                      .catch(error => console.error("Error:", error));

                    // Reset the active button's background color
                    activeButton.style.backgroundColor = "white";
                    console.log("Changing color back to white");

                    // Remove event listener for keyboard input
                    document.removeEventListener("keydown", handler);
                    activeButton = null; // Reset active button reference
                } else if (event.key.length === 1) {
                    // Append typed character to inputText
                    inputText += event.key;
                }
            };

            document.addEventListener("keydown", handler);
        });
    });
</script>
