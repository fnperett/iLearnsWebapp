<script>
    // Keep track of the currently active button
    let activeButton = null;
    let inputText = "";

    // Function to reset the button and active state
    function resetButton() {
        if (activeButton) {
            activeButton.style.backgroundColor = "white"; // Reset the background color
            activeButton = null; // Clear the active button reference
        }
        document.removeEventListener("keydown", handleKeydown); // Remove the previous keydown listener
        inputText = ""; // Clear input text
    }

    // Function to handle keydown events
    function handleKeydown(event) {
        if (event.key === "Enter") {
            // Send POST request when Enter is pressed
            if (activeButton) {
                fetch("/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ button_remap: activeButton.id, id: inputText })
                })
                .then(response => response.json())
                .then(data => console.log("Response:", data))
                .catch(error => console.error("Error:", error));
                
                // Reset button after sending the request
                resetButton();
            }
        } else if (event.key.length === 1) {
            // Append typed character to inputText if it's a single character
            inputText += event.key;
        }
    }

    // Add event listeners to all buttons
    document.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", function() {
            // If another button is already active, reset it
            if (activeButton) {
                resetButton();
            }

            // Set the clicked button as the active button
            activeButton = this;
            console.log("Button clicked:", this.id);
            this.style.backgroundColor = "gray"; // Highlight active button

            // Listen for keyboard input
            document.addEventListener("keydown", handleKeydown);
        });
    });




</script>
